@if (moreThanOneLanguage) {
  <div
    ngbDropdown
    class="navbar-nav"
    display="dynamic"
    placement="bottom-right"
  >
    <a
      href="javascript:void(0);"
      role="menuitem"
      [attr.aria-label]="'nav.language' | translate"
      aria-controls="language-menu-list"
      aria-haspopup="menu"
      [title]="'nav.language' | translate"
      (click)="$event.preventDefault()"
      data-toggle="dropdown"
      ngbDropdownToggle
      tabindex="0"
    >
      @switch (currentLang) {
        @case ('hu') {
          <span class="lang-flag lang-flag-hu" aria-hidden="true"></span>
        }
        @case ('en') {
          <span class="lang-flag lang-flag-en" aria-hidden="true"></span>
        }
        @default {
          <i class="fas fa-globe-asia fa-lg fa-fw"></i>
        }
      }
    </a>
    <ul
      ngbDropdownMenu
      class="dropdown-menu"
      [attr.aria-label]="'nav.language' | translate"
      id="language-menu-list"
      role="menu"
    >
      @for (lang of translate.getLangs(); track lang) {
        <li
          class="dropdown-item"
          tabindex="0"
          #langSelect
          role="menuitem"
          (keyup.enter)="useLang(lang)"
          (click)="useLang(lang)"
          [class.active]="lang === translate.currentLang"
        >
          {{ langLabel(lang) }}
        </li>
      }
    </ul>
  </div>
}
