<ds-results-back-button *ngIf="showBackButton$ | async" [back]="back"></ds-results-back-button>

<div class="row" *ngIf="iiifEnabled">
  <div class="col-12">
    <ds-mirador-viewer id="iiif-viewer" [object]="object" [searchable]="iiifSearchEnabled" [query]="iiifQuery$ | async">
    </ds-mirador-viewer>
  </div>
</div>

<div class="d-flex flex-row">
  <ds-item-page-title-field [item]="object" class="mr-auto"></ds-item-page-title-field>
  <ds-dso-edit-menu></ds-dso-edit-menu>
</div>

<div class="row">

  <div class="col-xs-12 col-md-4">

    <ng-container *ngIf="!(mediaViewer.image || mediaViewer.video)">
      <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
        <ds-thumbnail [thumbnail]="object?.thumbnail | async"></ds-thumbnail>
      </ds-metadata-field-wrapper>
    </ng-container>

    <div *ngIf="mediaViewer.image || mediaViewer.video" class="mb-2">
      <ds-media-viewer [item]="object"></ds-media-viewer>
    </div>

    <ds-item-page-file-section [item]="object"></ds-item-page-file-section>

    <ds-item-page-date-field [item]="object"></ds-item-page-date-field>

    <ds-metadata-representation-list [parentItem]="object" [itemType]="'Course'" [metadataFields]="['education.course']"
      [label]="'relationships.isCourseOfLearningObject' | translate">
    </ds-metadata-representation-list>

    <ds-metadata-representation-list [parentItem]="object" [itemType]="'CourseInstance'"
      [metadataFields]="['education.courseinstance']"
      [label]="'relationships.isCourseInstanceOfLearningObject' | translate">
    </ds-metadata-representation-list>

    <hr class="lo-meta-divider" *ngIf="hasAnyMeta(metaBeforeFirst) && hasAnyMeta(metaBetweenDividers)" role="separator"
      aria-hidden="true" />

    <hr class="lo-meta-divider" *ngIf="hasAnyMeta(metaBetweenDividers) && hasAnyMeta(metaAfterSecond)" role="separator"
      aria-hidden="true" />

    <ds-item-page-collections [item]="object"></ds-item-page-collections>

  </div>

  <div class="col-xs-12 col-md-7">

    <ds-generic-item-page-field [item]="object" [fields]="['dc.description']" [label]="'learningobject.description'">
    </ds-generic-item-page-field>

    <ds-item-page-uri-field [item]="object" [fields]="['dc.identifier.uri']" [label]="'item.page.uri'">
    </ds-item-page-uri-field>

    <div>
      <a class="btn btn-outline-primary" role="button" [routerLink]="[itemPageRoute + '/full']" tabindex="0">
        <i class="fas fa-info-circle"></i>
        {{ "item.page.link.full" | translate }}
      </a>
    </div>

  </div>
  <div class="mt-5 w-100">
    <ds-tabbed-related-entities-search [item]="object" [relationTypes]="[{
                                            label: 'IsCourseInstanceOfLO',
                                            filter: 'IsCourseInstanceOfLO',
                                            configuration: 'default-relationships'
                                          }]">
    </ds-tabbed-related-entities-search>
  </div>
</div>
