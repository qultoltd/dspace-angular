<ng-template #descTemplate>
  <span class="text-muted">
    <span class="item-list-item-title">
      <span [innerHTML]="titleForUiLang"></span>
    </span>
  </span>
</ng-template>

<ds-truncatable [id]="mdRepresentation?.id">
  <a [routerLink]="[itemPageRoute]" [innerHTML]="titleForUiLang || mdRepresentation?.getValue()" [ngbTooltip]="descriptionForUiLang || descTemplate">
  </a>
</ds-truncatable>
