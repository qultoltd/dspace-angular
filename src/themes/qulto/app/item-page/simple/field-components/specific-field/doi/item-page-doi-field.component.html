@if (doiValues.length > 0) {
  <ds-metadata-field-wrapper [label]="label | translate">
    @for (doi of doiValues; track doi.value; let last = $last) {
      <a class="dont-break-out"
         [href]="normalizeDoiUrl(doi.value)"
         target="_blank"
         rel="noopener noreferrer">{{ doi.value }}</a>
      @if (!last) {
        <span [innerHTML]="separator"></span>
      }
    }
  </ds-metadata-field-wrapper>
}
